claude_settings:
  permissions:
    defaultMode: auto
    allow:
      - Read(~/.claude/host-notes.md)
      - Edit(~/.claude/host-notes.md)
      - Write(~/.claude/host-notes.md)
  theme: dark
  skipAutoPermissionPrompt: true
  statusLine:
    type: command
    command: bash ~/.claude/statusline.sh
  # cheap-guard gates hold a call for up to 8 days (past any weekly reset)
  # and block it if the guard itself fails; its bookkeeping hooks never block.
  hooks:
    SessionStart:
      - hooks:
          - type: command
            command: $HOME/.claude/hooks/git-context --session
            timeout: 15
            statusMessage: Checking git state
      - hooks:
          - type: command
            command: $HOME/.claude/hooks/cheap-guard
            timeout: 30
    SessionEnd:
      - hooks:
          - type: command
            command: $HOME/.claude/hooks/cheap-guard
            timeout: 30
    UserPromptSubmit:
      - hooks: &cheap-gate
          - type: command
            command: $HOME/.claude/hooks/cheap-guard
            timeout: 691200
            onFailure: block
            statusMessage: "cheap: waiting for usage headroom"
    PostToolBatch:
      - hooks: *cheap-gate
    SubagentStart:
      - hooks: *cheap-gate
    PreCompact:
      - hooks: *cheap-gate
    PreToolUse:
      - matcher: Edit|Write|MultiEdit|NotebookEdit|Bash
        hooks:
          - type: command
            command: $HOME/.claude/hooks/git-context --guard
            timeout: 15
      - hooks: &cheap-bookkeeping
          - type: command
            command: $HOME/.claude/hooks/cheap-guard
            timeout: 30
    Stop:
      - hooks: *cheap-bookkeeping
    StopFailure:
      - hooks: *cheap-bookkeeping
    SubagentStop:
      - hooks: *cheap-bookkeeping
  enabledPlugins:
    frontend-design@claude-plugins-official: true
    superpowers@claude-plugins-official: true
    context7@claude-plugins-official: true
    code-review@claude-plugins-official: true
    code-simplifier@claude-plugins-official: true
    skill-creator@claude-plugins-official: false
    github@claude-plugins-official: true
    playwright@claude-plugins-official: true
    claude-md-management@claude-plugins-official: true
    typescript-lsp@claude-plugins-official: true
    security-guidance@claude-plugins-official: true
    claude-code-setup@claude-plugins-official: true
    pyright-lsp@claude-plugins-official: true
    telegram@claude-plugins-official: true
    humanizer@humanizer: true
  extraKnownMarketplaces:
    claude-plugins-official:
      source:
        source: github
        repo: anthropics/claude-plugins-official
    humanizer:
      source:
        source: github
        repo: blader/humanizer
